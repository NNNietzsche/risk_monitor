<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>资产风险监控</title>

    <link rel="stylesheet" href="/static/reference.css">
<link rel="stylesheet" href="/static/app.css?v=20260930-context">
<script src="/static/maps.js?v=20260930-context" defer></script>
<script src="/static/locations.js?v=20260930-context" defer></script>
<script src="/static/target-presenter.js?v=20260930-context" defer></script>
<script src="/static/management.js?v=20260930-context" defer></script>
<script src="/static/app.js?v=20260930-context" defer></script>
</head>

<body>

<!-- =========================================================
     Header
========================================================= -->

<header class="header">

    <div class="logo">

        <div class="logo-icon">
            R
        </div>

        <div>
            <div class="logo-title">
                Asset Monitor
            </div>

            <div class="logo-subtitle">
                船舶与航空监控
            </div>
        </div>

    </div>

    <div class="header-right">

        <div class="date">
            <span id="header-date"></span>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span id="system-status">正在连接</span>
        </div>

    </div>

</header>


<!-- =========================================================
     Main
========================================================= -->

<main class="container">
  <div class="page-heading"><div><div class="eyebrow">ASSET RISK MONITORING</div><h1>资产风险监控</h1></div><div class="updated">最近刷新 <span id="updated">—</span><br><span class="badge" id="data-mode">正在读取数据源</span></div></div>
  <p class="source-attribution" id="source-attribution">正在读取数据源说明</p><div class="toolbar"><div class="actions"><button class="primary" id="add">＋ 添加监控对象</button><button id="seed">载入演示数据</button><button id="manage">目标与区域管理</button><button id="refresh">刷新页面</button></div><span class="muted" id="schedule">正在读取采集设置</span></div>
  <div id="notice" role="status" aria-live="polite"></div>
  <div class="summary-grid" id="summary"></div>
  <section class="section"><div class="section-heading"><h2>指定目标跟踪</h2></div><div class="tracking-grid">
    <article class="panel"><div class="panel-heading"><h3>船舶跟踪</h3><div class="actions"><span id="vessel-count" class="badge" aria-live="polite">— 艘</span><button id="refresh-vessels">刷新船舶</button></div></div><div id="vessel-map" class="coordinate-map" aria-label="船舶世界地图"></div><p class="map-note">最近采集位置 · 矩形为监控区域</p><div id="vessels" class="target-list"></div></article>
    <article class="panel"><div class="panel-heading"><h3>航空跟踪</h3><div class="actions"><span id="flight-count" class="badge" aria-live="polite">— 个航班</span><button id="refresh-aviation">刷新航空</button></div></div><div id="flight-map" class="coordinate-map" aria-label="航空世界地图"></div><p class="map-note">最近采集位置 · 灰色为历史定位</p><div id="flights" class="target-list"></div></article>
  </div></section>
  <section class="section" aria-labelledby="timeline-title">
    <div class="section-header timeline-heading">
      <div><h2 id="timeline-title" class="section-title">目标动态时间线</h2><p class="section-description">状态更新与风险事件</p></div>
      <div class="actions timeline-filters">
        <select id="timeline-kind" aria-label="目标类型"><option value="">全部目标</option><option value="vessel">船舶</option><option value="flight">航班</option><option value="aircraft">飞机实体</option></select>
        <select id="timeline-type" aria-label="动态类型"><option value="all">全部动态</option><option value="events">仅规则事件</option><option value="quality">数据质量</option></select>
        <select id="timeline-severity" aria-label="事件级别"><option value="">全部级别</option><option value="high">高风险事件</option><option value="warning">关注事件</option><option value="info">恢复信息</option></select>
      </div>
    </div>
    <div class="timeline-shell"><div id="timeline" class="timeline"></div><div class="pagination"><button id="timeline-latest">回到最新</button><button id="timeline-prev">上一页</button><span id="timeline-page" aria-live="polite"></span><button id="timeline-next">下一页</button></div></div>
  </section>
  <section class="section panel"><div class="panel-heading"><h2>公开风险信息</h2><button id="add-news">录入公开信息</button></div><p class="muted section-note">公开资料仅供参考，不直接改变目标风险状态。</p><div id="news"></div></section>
  <section class="section panel"><div class="panel-heading"><div><h2>AI 风险解释</h2><p class="muted">结合目标动态与公开信息生成分析</p></div><button id="ai-refresh">更新 AI 分析</button></div><div class="ai-controls"><label><input type="checkbox" id="ai-enabled">启用 AI</label><label><input type="checkbox" id="ai-auto">资料变化后自动更新</label><span id="ai-state" class="muted"></span></div><p id="ai-meta" class="muted section-note"></p><div id="ai-content" class="analysis-text"></div></section>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="关闭">×</button></div><div id="dialog-body"></div><p id="dialog-error" role="alert"></p></dialog>
</main>



<!-- =========================================================
     Footer
========================================================= -->

<footer class="footer">

    Asset Risk Monitoring

</footer>


</body>
</html>
