<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>船舶与航空资产风险监控 · 交通银行东京分行</title>

<link rel="stylesheet" href="/static/app.css?v=20261009-enrollment1">
<script src="/static/maps.js?v=20261009-enrollment1" defer></script>
<script src="/static/locations.js?v=20261009-enrollment1" defer></script>
<script src="/static/target-presenter.js?v=20261009-enrollment1" defer></script>
<script src="/static/management.js?v=20261009-enrollment1" defer></script>
<script src="/static/timeline-pager.js?v=20261009-enrollment1" defer></script>
<script src="/static/app.js?v=20261009-enrollment1" defer></script>
</head>

<body>

<!-- =========================================================
     Header
========================================================= -->

<header class="header">
  <div class="logo">
    <span class="bank-symbol"><img src="/static/bocom-logo.png" alt="交通银行"></span>
    <div><h1 class="logo-title">船舶与航空资产风险监控</h1><div class="logo-subtitle">交通银行东京分行</div></div>
  </div>
  <div class="header-right">
    <div class="updated">最后刷新 <span id="updated">—</span></div>
    <div class="status neutral" id="header-status"><span class="status-dot" aria-hidden="true"></span><span id="system-status" role="status">正在连接</span></div>
  </div>
</header>

<main class="container">
  <div class="toolbar"><div class="actions"><button class="primary" id="add">＋ 添加监控对象</button><button id="manage">目标与区域管理</button></div><div class="risk-summary" id="summary" aria-label="风险提示"></div></div>
  <div id="notice" role="status" aria-live="polite"></div>
  <section class="tracking-grid" aria-label="资产跟踪">
    <article class="panel"><div class="panel-heading"><div><h2>船舶跟踪</h2><p class="panel-source">数据源：MarineTraffic</p></div><span id="vessel-count" class="asset-count">— 艘</span></div><div id="vessel-map" class="coordinate-map" aria-label="船舶世界地图"></div><p class="map-note" id="vessel-note">每 10 分钟自动采集 · 橙色为风险区域 · 灰色为历史定位</p><div id="vessels" class="target-list"></div></article>
    <article class="panel"><div class="panel-heading"><div><h2>航空跟踪</h2><p class="panel-source">数据源：Flightradar24</p></div><span id="flight-count" class="asset-count">— 架</span></div><div id="flight-map" class="coordinate-map" aria-label="航空世界地图"></div><p class="map-note" id="flight-note">每 10 分钟自动采集 · 灰色为历史定位</p><div id="flights" class="target-list"></div></article>
  </section>
  <section class="timeline-grid section" aria-label="目标动态">
    <article class="timeline-shell" aria-labelledby="vessel-timeline-title">
      <div class="timeline-heading"><h2 id="vessel-timeline-title">船舶动态</h2><div class="actions timeline-filters">
        <select id="vessel-timeline-type" aria-label="船舶动态类型"><option value="all">全部动态</option><option value="events">仅规则事件</option><option value="quality">数据质量</option></select>
        <select id="vessel-timeline-severity" aria-label="船舶事件级别"><option value="">全部级别</option><option value="high">高风险事件</option><option value="warning">关注事件</option><option value="info">恢复信息</option></select>
      </div></div>
      <div id="vessel-timeline" class="timeline"></div>
      <div class="pagination">
        <div class="page-navigation"><button id="vessel-timeline-latest">最新</button><button id="vessel-timeline-prev" aria-label="船舶动态上一页">上一页</button><span id="vessel-timeline-page" aria-live="polite"></span><button id="vessel-timeline-next" aria-label="船舶动态下一页">下一页</button></div>
        <form id="vessel-timeline-jump" class="page-jump"><label for="vessel-timeline-input">跳至</label><input id="vessel-timeline-input" type="number" inputmode="numeric" min="1" step="1" value="1" required aria-label="船舶动态页码"><span>页</span><button type="submit">跳转</button></form>
      </div>
      <p class="timeline-error" id="vessel-timeline-error" role="status"></p>
    </article>
    <article class="timeline-shell" aria-labelledby="aircraft-timeline-title">
      <div class="timeline-heading"><h2 id="aircraft-timeline-title">航空动态</h2><div class="actions timeline-filters">
        <select id="aircraft-timeline-type" aria-label="航空动态类型"><option value="all">全部动态</option><option value="events">仅规则事件</option><option value="quality">数据质量</option></select>
        <select id="aircraft-timeline-severity" aria-label="航空事件级别"><option value="">全部级别</option><option value="high">高风险事件</option><option value="warning">关注事件</option><option value="info">恢复信息</option></select>
      </div></div>
      <div id="aircraft-timeline" class="timeline"></div>
      <div class="pagination">
        <div class="page-navigation"><button id="aircraft-timeline-latest">最新</button><button id="aircraft-timeline-prev" aria-label="航空动态上一页">上一页</button><span id="aircraft-timeline-page" aria-live="polite"></span><button id="aircraft-timeline-next" aria-label="航空动态下一页">下一页</button></div>
        <form id="aircraft-timeline-jump" class="page-jump"><label for="aircraft-timeline-input">跳至</label><input id="aircraft-timeline-input" type="number" inputmode="numeric" min="1" step="1" value="1" required aria-label="航空动态页码"><span>页</span><button type="submit">跳转</button></form>
      </div>
      <p class="timeline-error" id="aircraft-timeline-error" role="status"></p>
    </article>
  </section>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="关闭">×</button></div><div id="dialog-body"></div><p id="dialog-error" role="alert"></p></dialog>
</main>



<!-- =========================================================
     Footer
========================================================= -->

<footer class="footer">交通银行东京分行 · 船舶与航空资产风险监控</footer>
</body>
</html>
