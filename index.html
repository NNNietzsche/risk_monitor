<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>船舶与航空资产风险监控 · 交通银行东京分行</title>

<link rel="stylesheet" href="/static/app.css?v=20260930-core3">
<script src="/static/maps.js?v=20260930-core3" defer></script>
<script src="/static/locations.js?v=20260930-core3" defer></script>
<script src="/static/target-presenter.js?v=20260930-core3" defer></script>
<script src="/static/management.js?v=20260930-core3" defer></script>
<script src="/static/app.js?v=20260930-core3" defer></script>
</head>

<body>

<!-- =========================================================
     Header
========================================================= -->

<header class="header">
  <div class="logo">
    <span class="bank-symbol"><img src="/static/bocom-logo.png" alt="交通银行"></span>
    <div><h1 class="logo-title">船舶与航空资产风险监控</h1><div class="logo-subtitle">交通银行东京分行</div></div>
  </div>
  <div class="header-right">
    <div class="updated">最后刷新 <span id="updated">—</span></div>
    <div class="status neutral" id="header-status"><span class="status-dot" aria-hidden="true"></span><span id="system-status" role="status">正在连接</span></div>
  </div>
</header>

<main class="container">
  <div class="toolbar"><div class="actions"><button class="primary" id="add">＋ 添加监控对象</button><button id="manage">目标与区域管理</button></div></div>
  <div id="notice" role="status" aria-live="polite"></div>
  <div class="summary-grid" id="summary"></div>
  <section class="tracking-grid" aria-label="资产跟踪">
    <article class="panel"><div class="panel-heading"><div><h2>船舶跟踪</h2><p class="panel-source">数据源：MarineTraffic</p></div><span id="vessel-count" class="badge">— 艘</span></div><div id="vessel-map" class="coordinate-map" aria-label="船舶世界地图"></div><p class="map-note" id="vessel-note">每 10 分钟自动采集 · 橙色为风险区域 · 灰色为历史定位</p><div id="vessels" class="target-list"></div></article>
    <article class="panel"><div class="panel-heading"><div><h2>航空跟踪</h2><p class="panel-source">数据源：Flightradar24</p></div><span id="flight-count" class="badge">— 架</span></div><div id="flight-map" class="coordinate-map" aria-label="航空世界地图"></div><p class="map-note" id="flight-note">每 10 分钟自动采集 · 灰色为历史定位</p><div id="flights" class="target-list"></div></article>
  </section>
  <section class="section" aria-labelledby="timeline-title">
    <div class="section-header timeline-heading">
      <div><h2 id="timeline-title" class="section-title">目标动态时间线</h2><p class="section-description">状态更新与风险事件</p></div>
      <div class="actions timeline-filters">
        <select id="timeline-kind" aria-label="目标类型"><option value="">全部目标</option><option value="vessel">船舶</option><option value="aircraft">飞机</option></select>
        <select id="timeline-type" aria-label="动态类型"><option value="all">全部动态</option><option value="events">仅规则事件</option><option value="quality">数据质量</option></select>
        <select id="timeline-severity" aria-label="事件级别"><option value="">全部级别</option><option value="high">高风险事件</option><option value="warning">关注事件</option><option value="info">恢复信息</option></select>
      </div>
    </div>
    <div class="timeline-shell"><div id="timeline" class="timeline"></div><div class="pagination"><button id="timeline-latest">回到最新</button><button id="timeline-prev">上一页</button><span id="timeline-page" aria-live="polite"></span><button id="timeline-next">下一页</button></div></div>
  </section>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="关闭">×</button></div><div id="dialog-body"></div><p id="dialog-error" role="alert"></p></dialog>
</main>



<!-- =========================================================
     Footer
========================================================= -->

<footer class="footer">交通银行东京分行 · 船舶与航空资产风险监控</footer>
</body>
</html>
